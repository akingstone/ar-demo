<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR-Demo: Marker lesen</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Statusleiste: sichtbar, sobald die Kamera läuft -->
  <header id="bar" hidden>
    <div id="status" role="status" aria-live="polite">Kamera wird gestartet …</div>
    <div id="hint">Marker vom Arbeitsblatt in die Kamera halten</div>
  </header>

  <!-- Startseite: Die Kamera startet erst nach einem Klick -->
  <main id="start" class="panel">
    <div class="panel-inner">
      <h1>AR-Demo: Marker lesen</h1>
      <p>Diese Seite erkennt die Marker vom Arbeitsblatt und blendet das passende 3D-Objekt über dem Kamerabild ein.</p>
      <button id="start-button" type="button">Kamera starten</button>
      <p id="permission-info" class="note"></p>
      <noscript><p class="note">Für diese Seite muss JavaScript im Browser eingeschaltet sein.</p></noscript>
    </div>
  </main>

  <!-- Fehlerseite. Die id "error-popup" verhindert, dass AR.js zusätzlich seine eigene englische Meldung einblendet. -->
  <section id="error-popup" class="panel" hidden>
    <div class="panel-inner">
      <h1 id="error-title">Die Kamera lässt sich nicht starten</h1>
      <p id="error-text"></p>
      <p id="error-help" class="note"></p>
      <button id="retry-button" type="button">Seite neu laden</button>
      <p id="error-detail" class="technical"></p>
    </div>
  </section>

  <!-- Bibliotheken (unverändert, siehe lib/README.md) -->
  <script src="lib/aframe-1.3.0.min.js"></script>
  <script src="lib/aframe-ar-3.4.5.js"></script>

  <!-- Eigener Code -->
  <script src="js/config.js"></script>
  <script src="js/models.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
